openapi: 3.0.0
info:
  version: 1.0.0
  title: REST API
  description: Infoway real-time market data REST API. Assembled verbatim from the 13 per-endpoint OpenAPI 3.0.0 definitions
    the provider publishes on its ReadMe developer hub (https://infoway.readme.io/reference/<page>.md). Operations, parameters,
    examples and security schemes are unmodified; only the documents were merged into one file.
servers:
- url: https://data.infoway.io
paths:
  /crypto/batch_kline/{klineType}/{klineNum}/{codes}:
    get:
      description: ''
      operationId: get_cryptobatch_kline{klineType}{klineNum}{codes}
      responses:
        '200':
          description: ''
      parameters:
      - name: klineType
        in: path
        required: true
        description: kline类型，多个用,间隔，参考上面的kline类型
        schema:
          type: string
          default: '1'
      - name: klineNum
        in: path
        required: true
        description: 最近多少根k线，最大支持500
        schema:
          type: string
          default: '10'
      - name: codes
        in: path
        required: true
        description: 标的代码，最大支持100
        schema:
          type: string
          default: BTCUSDT,BNBUSDT
      security:
      - ApiKeyAuth: []

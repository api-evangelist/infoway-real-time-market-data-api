name: Infoway Real-time Market Data API
description: >-
  Infoway is a real-time and historical financial market-data provider covering equities (US, Hong Kong,
  China A-shares, Japan, South Korea, India), forex, cryptocurrencies across 30+ exchanges, and
  commodities/futures. It ships two surfaces from the host data.infoway.io: a REST/HTTP API for symbol
  reference data, trading calendars, last-trade ticks, order-book depth and candlestick (K-line) history,
  and a WebSocket streaming API that pushes trades, depth, candles and multilingual news with
  millisecond latency. Both authenticate with a single API key whose entitlements follow the plan it was
  issued against (Free through Professional). Infoway publishes per-endpoint OpenAPI 3.0.0 definitions on
  its ReadMe developer hub, official Python, Node.js and Java SDKs, an llms.txt documentation index, and a
  stdio MCP server exposing 17 financial-data tools with a provider-authored Agent Skill.

- name: Infoway Financial Data MCP Server
  description: >-
    Official Model Context Protocol server (PyPI infoway-mcp-server) exposing 17 tools over stdio for
    real-time quotes, depth, K-line, market temperature and breadth, global indexes, industry and concept
    sectors, plate members and heatmaps, and single-stock fundamentals (company overview, valuation, analyst
    ratings, panorama, price drivers). Authenticated with the same API key via the INFOWAY_API_KEY environment
    variable. Local/stdio only — there is no hosted remote endpoint.
  humanURL: https://docs.infoway.io/sdk-and-tools/mcp-server.md
  baseURL: https://data.infoway.io

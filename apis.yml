apis:
- name: Infoway WebSocket Streaming API
  description: >-
    Persistent WebSocket connection for real-time trades, order-book depth, candlesticks and multilingual
    news. Integer protocol-code framing (10000 subscribe trade, 10002 trade push, 10003/10005 depth, 10006/10008
    candles, 10020/10022 news, 11000-11002 unsubscribe) with a client-supplied trace id and a mandatory
    heartbeat (code 10010) at least once per minute. API key is supplied as the apikey query parameter
    on the connection URL.
  humanURL: https://docs.infoway.io/websocket-api/endpoints.md
  baseURL: wss://data.infoway.io/ws

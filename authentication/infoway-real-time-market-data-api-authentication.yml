  type: apiKey
  in: query
  parameter: apikey
  surface: websocket
  sources:
  - https://infoway.readme.io/reference/ws-subscription.md
  note: >-
    Supplied on the connection URL: wss://data.infoway.io/ws?business={stock|crypto|common}&apikey=KEY.
    Case differs from the REST header (apikey vs apiKey) — a real integration trap. Carrying the key in a
    query string also means it can land in proxy and server logs.

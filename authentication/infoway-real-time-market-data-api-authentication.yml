key_management:
  issuance: >-
    Register at https://infoway.io/en/create-account, then the key is issued from the dashboard at
    https://infoway.io/dashboard.
  one_key_per_plan: true
  multiple_plans_per_account: true
  rotation: not documented
  expiry: tied to the plan's validity period; renewal and upgrade are done from the dashboard
  revocation: not documented
  free_tier: >-
    A free plan exists (2 req/s, 10,000 requests/day). The provider-published SKILL.md additionally
    advertises a "7-day free trial with full access".
gaps:
  - No documented key-rotation or revocation procedure.
  - No scope or permission model — a key is all-or-nothing within its plan entitlements.
  - >-
    The WebSocket surface accepts the key as a URL query parameter, which is weaker than a header and is not
    flagged as a risk in the provider's documentation.

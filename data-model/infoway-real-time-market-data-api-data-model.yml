      - {name: eps, type: string}
      - {name: eps_ttm, type: string}
      - {name: bps, type: string}
      - {name: dividend_yield, type: string}
      - {name: stock_derivatives, type: string}
      - {name: board, type: string, example: SZMainConnect}
  - name: Market
    description: A trading venue with its intraday session schedule.
    source_operation: 'openapi/infoway-real-time-market-data-api-openapi.yml#get_commonbaiscmarkets'
    identifier: market
    fields:
      - {name: market, type: string, example: US}
      - {name: remark, type: string}
      - {name: trade_schedules, type: array, items: TradeSchedule}
  - name: TradeSchedule
    description: One contiguous session window inside a market's trading day.
    embedded_in: Market
    fields:
      - {name: begin_time, type: string, example: '09:30:00'}
      - {name: end_time, type: string, example: '16:00:00'}
      - {name: type, type: string, enum: [PreTrade, NormalTrade, PostTrade]}
  - name: TradingCalendar
    description: The set of full and half trading days for a market over a date range.
    source_operation: 'openapi/infoway-real-time-market-data-api-openapi.yml#get_commonbasicmarketstrading_days'
    identifier: market
    fields:
      - {name: trade_days, type: array, items: string, format: YYYYMMDD}
      - {name: half_trade_days, type: array, items: string, format: YYYYMMDD}
  - name: Trade
    description: A last-trade tick for one instrument.
    source_operation:
      - 'openapi/infoway-real-time-market-data-api-openapi.yml#get_stockbatch_trade{codes}'
      - 'openapi/infoway-real-time-market-data-api-openapi.yml#get_cryptobatch_trade{codes}'

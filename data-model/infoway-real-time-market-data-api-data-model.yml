  - name: Depth
    description: >-
      Order-book snapshot. Both sides are a two-element array of parallel arrays — [prices[], quantities[]] —
      NOT an array of level objects. `a` and `b` can be null when no book is available (observed on TSLA.US).
    source_operation:

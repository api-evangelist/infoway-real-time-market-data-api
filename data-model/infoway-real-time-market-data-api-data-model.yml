note: >-
  The published OpenAPI declares NO components.schemas — every operation documents its shape only through a
  response example. This model was therefore derived from those verbatim examples plus the provider's field
  tables. Field names and types are as published; nothing was invented. There is no $ref graph to walk, so
  relationships are inferred from shared join keys (`symbol` / `s`, and `market`).

join_keys:
  - key: symbol
    aka: [s]
    description: >-
      The universal instrument identifier and the spine of the whole model. Suffixed by venue for equities
      (.US, .HK, .SH, .SZ), bare for crypto pairs (BTCUSDT) and forex pairs (USDJPY).
  - key: market
    description: Two-letter market code (CN, HK, US, ...) used to join instruments to calendars and sessions.

entities:
  - name: Symbol
    description: An instrument listing. Returned by the symbol list operation.
    source_operation: 'openapi/infoway-real-time-market-data-api-openapi.yml#get_commonbasicsymbols'
    identifier: symbol
    fields:
      - {name: symbol, type: string, example: '.DJI.US'}
      - {name: name_cn, type: string}
      - {name: name_hk, type: string}
      - {name: name_en, type: string}
  - name: SymbolInfo
    description: Static/reference detail for one instrument, including share counts and per-share metrics.
    source_operation: 'openapi/infoway-real-time-market-data-api-openapi.yml#get_symbolsinfo'
    identifier: symbol
    fields:
      - {name: symbol, type: string, example: '000001.SZ'}
      - {name: market, type: string, example: CN}
      - {name: name_cn, type: string}
      - {name: name_en, type: string}
      - {name: name_hk, type: string}

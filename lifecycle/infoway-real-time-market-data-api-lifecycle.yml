versioning:
  scheme: uri-path (partial)
  current: mixed — unversioned v1 paths alongside a /v2/ family
  detail: >-
    Basic/reference and original market-data paths carry no version segment
    (/common/basic/symbols, /stock/batch_trade/{codes}). The newer batch K-line form and the whole
    analytical family are under v2 (/{prefix}/v2/batch_kline, /common/v2/basic/market/...,
    /common/v2/basic/plate/..., /common/v2/basic/stock/...). Infoway publishes no written versioning policy
    describing how the two coexist or how long v1 is supported.
